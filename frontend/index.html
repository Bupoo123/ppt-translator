<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT翻译工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: #f0f2ff;
            border-radius: 10px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .file-size {
            color: #666;
            font-size: 12px;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-container.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .download-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
        }

        .download-link:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 PPT翻译工具</h1>
        <p class="subtitle">轻松将中文PPT转换为英文，完整保留原始格式</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <div class="upload-text">点击或拖拽上传PPT文件</div>
            <div class="upload-hint">支持 .pptx 和 .ppt 格式</div>
            <input type="file" id="fileInput" accept=".pptx,.ppt">
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">准备中...</div>
            <div class="upload-hint" id="progressHint" style="margin-top:8px; display:none;">大文件可能需要 3 到 10 分钟，请不要关闭页面。</div>
        </div>

        <button class="button" id="translateButton" disabled>开始翻译</button>

        <div class="message" id="message"></div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const translateButton = document.getElementById('translateButton');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const progressHint = document.getElementById('progressHint');
        const message = document.getElementById('message');

        let selectedFile = null;
        let activeTimer = null;
        let activeTimeout = null;
        let activeJobTimeout = null;
        const REQUEST_TIMEOUT_MS = 60 * 1000;
        const JOB_TIMEOUT_MS = 20 * 60 * 1000;
        const STATUS_POLL_MS = 3000;

        // 点击上传区域
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        // 处理文件
        function handleFile(file) {
            if (!file) return;

            if (!file.name.endsWith('.pptx') && !file.name.endsWith('.ppt')) {
                showMessage('只支持PPT/PPTX文件', 'error');
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('show');
            translateButton.disabled = false;
            hideMessage();
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function resetProgressState() {
            if (activeTimer) {
                clearInterval(activeTimer);
                activeTimer = null;
            }
            if (activeTimeout) {
                clearTimeout(activeTimeout);
                activeTimeout = null;
            }
        }

        function startProgressTips() {
            const stages = [
                { second: 0, progress: 12, text: '正在上传文件...', hint: '大文件可能需要 3 到 10 分钟，请不要关闭页面。' },
                { second: 5, progress: 22, text: '文件已上传，正在解析 PPT...', hint: '如果图片很多或动画复杂，解析会更慢。' },
                { second: 20, progress: 38, text: '正在逐页提取文本...', hint: '页数越多，等待时间越长。' },
                { second: 45, progress: 55, text: '正在调用翻译模型...', hint: '模型处理期间请保持页面打开。' },
                { second: 90, progress: 68, text: '大文件处理中，请继续等待...', hint: '如果超过 5 分钟仍未完成，再考虑重试。' },
                { second: 180, progress: 78, text: '仍在处理中...', hint: '当前任务较大，请勿刷新页面。' }
            ];
            const startedAt = Date.now();
            progressHint.style.display = 'block';
            const updateStage = () => {
                const elapsed = Math.floor((Date.now() - startedAt) / 1000);
                let current = stages[0];
                for (const stage of stages) {
                    if (elapsed >= stage.second) current = stage;
                }
                progressFill.style.width = `${current.progress}%`;
                progressText.textContent = current.text;
                progressHint.textContent = current.hint;
            };
            updateStage();
            activeTimer = setInterval(updateStage, 1000);
        }

        async function pollJob(jobId) {
            const startedAt = Date.now();
            progressHint.style.display = 'block';
            progressHint.textContent = '任务已提交，正在后台处理，请保持页面打开。';

            while (Date.now() - startedAt < JOB_TIMEOUT_MS) {
                const response = await fetch(`${API_BASE_URL}/status/${jobId}`, { cache: 'no-store' });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '查询任务状态失败');
                }

                if (data.stage) {
                    progressText.textContent = data.stage;
                }
                if (typeof data.slides_done === 'number' && typeof data.slides_total === 'number' && data.slides_total > 0) {
                    const ratio = Math.min(data.slides_done / data.slides_total, 1);
                    progressFill.style.width = `${Math.max(15, Math.round(15 + ratio * 75))}%`;
                    progressHint.textContent = `已处理 ${data.slides_done}/${data.slides_total} 页`; 
                }

                if (data.status === 'completed') {
                    progressFill.style.width = '100%';
                    progressText.textContent = '翻译完成！';
                    progressHint.textContent = '结果已生成，可以直接下载。';
                    return data;
                }

                if (data.status === 'failed') {
                    throw new Error(data.error || '后台任务失败');
                }

                await new Promise(resolve => setTimeout(resolve, STATUS_POLL_MS));
            }

            throw new Error('后台任务超过 20 分钟仍未完成，请稍后重试。');
        }

        // 翻译按钮
        translateButton.addEventListener('click', async () => {
            if (!selectedFile) return;

            resetProgressState();
            if (activeJobTimeout) {
                clearTimeout(activeJobTimeout);
                activeJobTimeout = null;
            }
            translateButton.disabled = true;
            progressContainer.classList.add('show');
            hideMessage();

            const formData = new FormData();
            formData.append('file', selectedFile);
            startProgressTips();

            const controller = new AbortController();
            activeTimeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

            try {
                const response = await fetch(`${API_BASE_URL}/translate`, {
                    method: 'POST',
                    body: formData,
                    signal: controller.signal
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '提交翻译任务失败');
                }

                resetProgressState();
                progressFill.style.width = '18%';
                progressText.textContent = data.stage || '任务已提交';
                progressHint.style.display = 'block';
                progressHint.textContent = '后台处理中，请保持页面打开。';

                const result = await pollJob(data.job_id);
                const downloadUrl = `${API_BASE_URL}/download/${result.file_id}`;
                showMessage(
                    `翻译完成！已处理 ${result.slides_processed} 张幻灯片。`,
                    'success',
                    downloadUrl
                );
                translateButton.disabled = false;
            } catch (error) {
                resetProgressState();
                progressContainer.classList.remove('show');
                progressHint.style.display = 'none';
                const messageText = error.name === 'AbortError'
                    ? '上传阶段等待超过 60 秒，已停止本次提交。请重试；如果仍失败，再联系管理员检查网络链路。'
                    : '翻译失败：' + error.message;
                showMessage(messageText, 'error');
                translateButton.disabled = false;
            }
        });

        // 显示消息
        function showMessage(text, type, downloadUrl = null) {
            message.textContent = text;
            message.className = `message show ${type}`;
            
            if (downloadUrl) {
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.className = 'download-link';
                link.textContent = '下载翻译后的PPT';
                link.download = '';
                message.appendChild(document.createElement('br'));
                message.appendChild(link);
            }
        }

        // 隐藏消息
        function hideMessage() {
            message.classList.remove('show');
            message.innerHTML = '';
        }
    </script>
</body>
</html>
